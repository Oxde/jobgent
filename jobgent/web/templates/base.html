<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Jobgent{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/htmx/2.0.4/htmx.min.js" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous" defer></script>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <a class="wordmark" href="/">Jobgent</a>
    <nav>
      <a href="/" {% if request.url.path == '/' %}aria-current="page"{% endif %}>Feed</a>
      <a href="/tracker" {% if request.url.path == '/tracker' %}aria-current="page"{% endif %}>Tracker</a>
    </nav>
    {% set pct = (100 * stats.applied_this_week / stats.goal) if stats.goal else 0 %}
    {% set pct = 100 if pct > 100 else pct %}
    <a class="goal" href="/tracker" title="Applications sent this week against your goal">
      <svg class="ring" viewBox="0 0 36 36" aria-hidden="true">
        <circle class="track" cx="18" cy="18" r="15"></circle>
        <circle class="bar" cx="18" cy="18" r="15" stroke-dasharray="94.2" stroke-dashoffset="{{ '%.1f' % (94.2 - 94.2 * pct / 100) }}"></circle>
      </svg>
      <span><b>{{ stats.applied_this_week }} / {{ stats.goal }}</b> <span class="label">sent this week</span></span>
    </a>
  </div>
</header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
